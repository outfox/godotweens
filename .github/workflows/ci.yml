name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Package version supplied by the release tag.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and pack
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Resolve package version
        env:
          RELEASE_VERSION: ${{ inputs.package-version }}
        run: |
          $version = $env:RELEASE_VERSION
          if (!$version) {
            $project = [xml](Get-Content godotweens/godotweens.csproj -Raw)
            $version = $project.Project.PropertyGroup.Version
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore
        run: dotnet restore godotweens.slnx -p:Configuration=Release
      - name: Check release failure handling
        run: ./.github/scripts/Test-ReleasePublishing.ps1
      - name: Build
        run: dotnet build godotweens.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=$env:PACKAGE_VERSION
      - name: Test
        run: dotnet test testbed/testbed.tests/testbed.tests.csproj -c Release --no-build --no-restore --logger 'trx;LogFileName=tests.trx' --results-directory artifacts/test-results
      - name: Run headless testbed
        timeout-minutes: 2
        run: dotnet run --project testbed/testbed.2dog -c Release --no-build --no-restore -- --headless --quit-after 12
      - name: Pack
        run: dotnet pack godotweens/godotweens.csproj -c Release --no-build --no-restore -p:ContinuousIntegrationBuild=true -p:Version=$env:PACKAGE_VERSION -o artifacts/packages
      - name: Verify package and compile a package consumer
        run: ./.github/scripts/Verify-Package.ps1 -Version $env:PACKAGE_VERSION
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godotweens-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
